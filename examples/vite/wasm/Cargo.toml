[package]
name = "scsynth-client-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "The wasm of the Vite example of scsynth-client."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicmell/scsynth-client"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.106"
scsynth-client = { path = "../../..", version = "0.1.0", features = ["serde", "web"] }
serde = { version = "1.0.140", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["MessagePort", "Worker"] }

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
