[package]
name = "scsynth-client-bridge"
version = "0.0.0"
edition = "2024"
publish = false
description = "The websocket bridge of the examples of scsynth-client: it pipes each websocket to its own TCP connection to scsynth."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicmell/scsynth-client"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
scsynth-client = { path = "../..", version = "0.1.0" }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
